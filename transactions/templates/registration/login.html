{% extends 'transactions/base.html' %}

{% block title %}Sign In - CyberFinance{% endblock %}

{% block content %}
    <h1 style="color: #00adb5;">Account Login</h1>
    <p style="color: #aaa;">Please enter your credentials to access your private ledger balances.</p>

    <form method="post" style="background: #1e1e1e; padding: 25px; border-radius: 8px; margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="margin-top: 15px;">Login</button>
    </form>
{% endblock %}
