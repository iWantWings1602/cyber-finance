    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CyberFinance CBV{% endblock %}</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1, h2, h3 { color: #00adb5; }
        a { color: #00adb5; text-decoration: none; }
        a:hover { text-decoration: underline; }
        nav { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; justify-content: space-between; }
        .nav-links { display: flex; gap: 20px; }
        .card { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 5px solid #393e46; display: flex; justify-content: space-between; align-items: center; }
        .expense { border-left-color: #ff2e63; }
        .income { border-left-color: #21bf73; }
        .badge { background-color: #393e46; padding: 3px 8px; border-radius: 4px; font-size: 0.85em; }
        .btn { background-color: #00adb5; color: #fff; padding: 8px 15px; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; text-decoration: none; }
        .btn-danger { background-color: #ff2e63; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="{% url 'transaction_list' %}"> Global Ledger</a>
            {% if user.is_authenticated %}
                <a href="{% url 'my_transactions' %}" style="color: #ff2e63; font-weight: bold;"> My Transactions</a>
            {% endif %}
            <a href="{% url 'large_expenses' %}"> Large Expenses</a>
            <a href="{% url 'account_list' %}"> Wallets</a>
        </div>

        <div style="display: flex; align-items: center; gap: 15px;">
            {% if user.is_authenticated %}
                <span style="color: #bbb;">Hello, <strong>{{ user.username }}</strong></span>
                <form method="post" action="{% url 'logout' %}" style="margin: 0;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger" style="padding: 5px 10px; font-size: 0.9em;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Sign In</a>
                <a href="{% url 'signup' %}" class="btn" style="padding: 5px 10px; font-size: 0.9em; color: white;">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <hr style="border-color: #393e46; margin-bottom: 20px;">


    {% block content %}{% endblock %}

</body>
</html>
