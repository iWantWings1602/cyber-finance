<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CyberFinance CBV{% endblock %}</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1, h2, h3 { color: #00adb5; }
        a { color: #00adb5; text-decoration: none; }
        a:hover { text-decoration: underline; }
        nav { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; justify-content: space-between; }
        .nav-links { display: flex; gap: 20px; }
        .card { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 5px solid #393e46; display: flex; justify-content: space-between; align-items: center; }
        .expense { border-left-color: #ff2e63; }
        .income { border-left-color: #21bf73; }
        .badge { background-color: #393e46; padding: 3px 8px; border-radius: 4px; font-size: 0.85em; }
        .btn { background-color: #00adb5; color: #fff; padding: 8px 15px; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; }
        .btn-danger { background-color: #ff2e63; }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 25px; background: #1e1e1e; padding: 10px; border-radius: 5px; }
        .alert { background-color: #21bf73; color: #fff; padding: 12px; border-radius: 5px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #00adb5; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #1e1e1e; border: 1px solid #393e46; color: #fff; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>
    {% if messages %}
        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <nav>
        <div class="nav-links">
            <a href="{% url 'transaction_list' %}"> Ledger</a>
            <a href="{% url 'large_expenses' %}"> Large Expenses (>500)</a>
            <a href="{% url 'account_list' %}"> Wallets</a>
        </div>
        <form method="get" action="{% url 'transaction_list' %}" style="display: flex; gap: 5px;">
            <input type="text" name="q" placeholder="Search comments..." value="{{ request.GET.q }}" style="padding: 5px; background: #2d2d2d; border: 1px solid #393e46; color: #fff; border-radius: 4px;">
            <button type="submit" class="btn" style="padding: 5px 10px; font-size: 0.9em;">Go</button>
        </form>
    </nav>

    {% block content %}{% endblock %}
</body>
</html>
